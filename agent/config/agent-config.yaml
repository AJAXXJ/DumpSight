llm:
  fast_model: qwen3.5-flash
  strong_model: qwen3.6-plus
  temperature: 0.0
  max_tokens: 4096
  timeout: 60
  max_retries: 3

api_keys:
  openai_api_key: "sk-635395661b8244079ad92fceff508526"
  openai_api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"

vector_store:
  type: chroma
  chroma:
    host: localhost
    port: 8000
    collection: dpdk_cases
  qdrant:
    host: localhost
    port: 6333
    collection: dpdk_cases

embedding:
  model: text-embedding-v4

metadata_db:
  url: sqlite:///./case_library.db

