  top_k: 5
  score_threshold: 0.7

monitor:
  interval_1s: 1.0
  interval_5s: 5.0
  webhook_url: ""
  cooldown_sec: 60

prompt:
  version: "v1"
  few_shots_enabled: true
  few_shots_max: 3

langgraph:
  checkpointer_type: memory
  checkpointer_db_url: ./langgraph_checkpoints.db

log:
  level: INFO
  json: false